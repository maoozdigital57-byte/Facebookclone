<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="mt-44 flex items-center justify-center gap-12 max-w-5xl mx-auto">
        <div class="left w-1/2">
            <img src="fb-removebg-preview.png" class=" hover:transform hover:scale-105 transition duration-300 ease-in-out w-72 -ml-4 py-2">
            <p class="text-3xl">Facebook helps you connect and share with the people in your life.</p>
        </div>
<div class="w-1/3 flex flex-col">

    <div class="right bg-white flex flex-col p-8 rounded-lg shadow-lg w-full">
        <input class="px-4 h-12 my-2 border-2 border-gray-300 rounded-lg" type="text" placeholder="Email or Phone Number">
        <input class="px-4 h-12 my-2 border-2 border-gray-300 rounded-lg hover:outline-black hover:duration-75" type="password" placeholder="Password">
        <button class="bg-blue-600 text-white my-2 cursor-pointer font-bold text-xl py-2 px-4 rounded-lg hover:bg-blue-500 hover:shadow-lg hover:shadow-blue-600">Log In</button>
        <span class="text-blue-500 cursor-pointer text-center text-sm mt-2 mb-4">Forgot password?</span>
        <hr class="mb-2 border-b border-gray-300">
        <button class="bg-green-500 text-white my-2 mx-auto cursor-pointer w-fit font-bold text-xl py-3 px-4 rounded-lg hover:bg-green-400 hover:shadow-lg hover:shadow-green-500">Create New Account</button>
    </div>

    <p class="text-center text-sm text-gray-600 mt-4 ">© 2023 Facebook ==></p>

</div>
    </div>
</body>
</html>
